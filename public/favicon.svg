<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Tipografia Nuova Stampa">
  <title>Tipografia Nuova Stampa</title>
  <!-- Marchio Nuova Stampa: carattere mobile con la tacca.
